name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: chmod +x gradlew && ./gradlew shadowJar --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error

  server-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.20.6", java: 21 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.4", java: 21 }
          - { mc: "1.21.8", java: 21 }
          - { mc: "1.21.10", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: server/plugins

      - name: Boot Paper ${{ matrix.mc }}
        run: |
          chmod +x .github/scripts/test-server.sh
          .github/scripts/test-server.sh "${{ matrix.mc }}"

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.mc }}
          path: |
            server/logs
            server/console.log
          if-no-files-found: ignore
