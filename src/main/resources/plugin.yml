name: kCombatLog
description: $description
version: '${version}'

softdepend:
  - PlaceholderAPI
  - WorldGuard

main: dev.kwlew.kCombatLog.kCombatLog
api-version: '1.20'
load: POSTWORLD

authors: [ kwlew ]
website: kwlew.dev

commands:
  combatlog:
    description: Manage and inspect combat tags.
    usage: /<command> <reload|tag|untag|status>
    aliases: [ ct ]

permissions:
  kCombatLog.player:
    description: Default player permissions, is affected by combat logging.
    default: true
  kCombatLog.reload:
    description: Allows player to reload the plugin.
    default: op
  kCombatLog.admin:
    description: Gives player all admin permissions.
    default: op
    children:
      [ kCombatLog.reload ]
